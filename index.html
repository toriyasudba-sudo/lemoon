function trWord(w) {
  if (lang === 'ru') return w;
  return EN_DICT[w] || w;
}
function trComp(c) {
  if (lang === 'ru') return c;
  var out = c;
  for (var k in EN_DICT) {
    if (EN_DICT.hasOwnProperty(k)) out = out.split(k).join(EN_DICT[k]);
  }
  return out;
}
function trName(p) {
  return lang === 'en' ? (EN_NAMES[p.id] || p.name) : p.name;
}

function sale(p) { return Math.round(p * (1 - DISCOUNT)); }

function conv(rubVal) {
  if (curr === 'RUB') return Math.round(rubVal);
  var val = rubVal * (RATES[curr] || 1);
  return val < 10 ? Math.max(1, Math.round(val)) : Math.round(val);
}

function money(rubVal) {
  var v = conv(rubVal);
  var s = v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  if (curr === 'GBP') return '£' + s;
  if (curr === 'EUR') return '€' + s;
  return s + ' ₽';
}

function avail(p, vi) {
  var st = STOCK[p.id + ':' + vi] || STOCK[p.id];
  if (!st) return p.vs[vi].s;
  var res = [];
  for (var i = 0; i < p.vs[vi].s.length; i++) {
    if (st.indexOf(p.vs[vi].s[i]) !== -1) res.push(p.vs[vi].s[i]);
  }
  return res;
}

  var res = [];
  for (var i = 0; i < cart.length; i++) {
    var c = cart[i], p = findProduct(c.id);
    if (!p || !p.vs[c.vi]) continue;
    var v = p.vs[c.vi];
    var partTxt = v.n ? ' (' + trWord(v.n) + ')' : '';
    var colTxt  = p.colors.length > 1 ? (lang === 'en' ? ', color: ' : ', цвет: ') + trWord(c.color) : '';
    var szTxt   = (lang === 'en' ? ', size: ' : ', разм.: ') + trWord(c.size);
    res.push({
      c: c, p: p, v: v, priceRub: sale(v.p),
      thumb: IMG_DIR + p.id + '_1' + IMG_EXT,
      text: trName(p) + partTxt + colTxt + szTxt
    });
  }
  return res;
}

function getTotalRub() {
  var ls = getLines(), sum = 0;
  for (var i = 0; i < ls.length; i++) sum += ls[i].priceRub * ls[i].c.q;
  return sum;
}

function updateBar() {
  var ls = getLines(), n = 0;
  for (var i = 0; i < ls.length; i++) n += ls[i].c.q;
  $('bar').className = n > 0 ? 'bar on' : 'bar';
  $('barN').textContent = (lang === 'en' ? 'Shopping Bag · ' + n + ' pcs' : 'Корзина · ' + n + ' шт.');
  $('barS').textContent = money(getTotalRub());
}

function toast(t) {
  var e = $('toast');
  e.textContent = t;
  e.style.display = 'block';
  setTimeout(function() { e.style.display = 'none'; }, 1800);
}

function escAttr(s) {
  return (s || '').replace(/"/g, '&quot;');
}

function drawCart() {
  var ls = getLines();
  var html = '<button type="button" class="x" data-close="1">×</button><h3>' + (lang === 'en' ? 'Your Order' : 'Ваш заказ') + '</h3>';
  if (ls.length) {
    for (var i = 0; i < ls.length; i++) {
      var l = ls[i];
      var fallbackTxt = lang === 'en' ? 'Photo' : 'Фото';
      html += '<div class="row">' +
        '<div class="cart-item-left">' +
          '<div class="cart-thumb"><img src="' + l.thumb + '" alt="" onerror="this.parentNode.innerHTML=\'' + fallbackTxt + '\'"></div>' +
          '<div class="cart-desc"><b>' + l.text + '</b><br><small><s>' + money(l.v.p) + '</s> → <b style="color:var(--sale)">' + money(l.priceRub) + '</b></small></div>' +
        '</div>' +
        '<span class="qty"><button type="button" data-q="' + i + '" data-d="-1">−</button>' + l.c.q + '<button type="button" data-q="' + i + '" data-d="1">+</button></span>' +
      '</div>';
    }
    html += '<div class="tot"><span>' + (lang === 'en' ? 'Total (−70% Sale):' : 'Итого со скидкой −70%:') + '</span><span>' + money(getTotalRub()) + '</span></div>' +
      '<div class="form-sec">' +
        '<div class="form-sec-title">' + (lang === 'en' ? 'Contact Details' : 'Контактные данные') + '</div>' +
        '<input id="f_name" placeholder="' + (lang === 'en' ? 'Your Name & Phone Number' : 'Ваше имя и телефон') + '" value="' + escAttr(userForm.name) + '" oninput="saveUserForm()">' +
        '<input id="f_tg" placeholder="' + (lang === 'en' ? 'Your Telegram (@username) or Contact' : 'Ваш Telegram (@username) или контакт') + '" value="' + escAttr(userForm.tg) + '" oninput="saveUserForm()">' +
      '</div>' +
      '<div class="form-sec">' +
        '<div class="form-sec-title">' + (lang === 'en' ? 'Shipping Address' : 'Адрес доставки') + '</div>' +
        '<div class="form-row-2">' +
          '<input id="f_zip" placeholder="' + (lang === 'en' ? 'Postcode' : 'Индекс') + '" value="' + escAttr(userForm.zip) + '" oninput="saveUserForm()">' +
          '<input id="f_city" placeholder="' + (lang === 'en' ? 'City / Country' : 'Город') + '" value="' + escAttr(userForm.city) + '" oninput="saveUserForm()">' +
        '</div>' +
        '<input id="f_addr" placeholder="' + (lang === 'en' ? 'Street address, house, apt' : 'Улица, дом, квартира (или пункт СДЭК)') + '" value="' + escAttr(userForm.addr) + '" oninput="saveUserForm()">' +
        '<textarea id="f_comm" rows="2" placeholder="' + (lang === 'en' ? 'Order notes (size questions, delivery preferences)' : 'Пожелания к заказу (уточнения по размеру, доставке и т.д.)') + '" oninput="saveUserForm()">' + (userForm.comm || '') + '</textarea>' +
      '</div>' +
      '<button type="button" class="btn sale-btn" data-send="1">' + (lang === 'en' ? 'Send Order to @' + ORDER_TO : 'Оформить заказ в @' + ORDER_TO) + '</button>' +
      '<p class="note">' + (lang === 'en'
        ? 'This will open a direct chat with <b>@' + ORDER_TO + '</b> in Telegram with your pre-filled order summary.'
        : 'Откроется диалог с <b>@' + ORDER_TO + '</b> в Telegram с готовым текстом вашего заказа.<br>Нажимая кнопку, вы соглашаетесь на обработку персональных данных ООО «Лемун 8/9» (ИНН 7813685586) в соответствии с ФЗ №152-ФЗ.') + '</p>';
  } else {
    html += '<p class="note" style="margin:24px 0">' + (lang === 'en' ? 'Your bag is empty' : 'Корзина пуста') + '</p>';
  }
  $('sheet').innerHTML = html;
}

function orderText() {
  saveUserForm();
  var ls = getLines();
  var linesTxt = [];
  for (var i = 0; i < ls.length; i++) {
    var l = ls[i];
    linesTxt.push((i + 1) + '. ' + l.text + ' — ' + l.c.q + (lang === 'en' ? ' pcs × ' : ' шт. × ') + money(l.priceRub));
  }
  var deliveryParts = [];
  if (userForm.zip)  deliveryParts.push((lang === 'en' ? 'Postcode: ' : 'Индекс: ') + userForm.zip);
  if (userForm.city) deliveryParts.push((lang === 'en' ? 'City: ' : 'Город: ') + userForm.city);
  if (userForm.addr) deliveryParts.push((lang === 'en' ? 'Address: ' : 'Адрес: ') + userForm.addr);

  if (lang === 'en') {
    return 'Hello! I would like to place an order from LeMoon 8/9 (Archive Sale −70%):\n\n' +
      linesTxt.join('\n') + '\n\nTotal: ' + money(getTotalRub()) +
      (userForm.name ? '\nName / Phone: ' + userForm.name : '') +
      (userForm.tg   ? '\nTelegram: ' + userForm.tg : '') +
      (deliveryParts.length ? '\n' + deliveryParts.join(', ') : '') +
      (userForm.comm ? '\nNotes: ' + userForm.comm : '');
  }
  return 'Здравствуйте! Хочу оформить заказ LeMoon 8/9 (распродажа −70%):\n\n' +
    linesTxt.join('\n') + '\n\nИтого со скидкой: ' + money(getTotalRub()) +
    (userForm.name ? '\nИмя / тел.: ' + userForm.name : '') +
    (userForm.tg   ? '\nTelegram: ' + userForm.tg : '') +
    (deliveryParts.length ? '\n' + deliveryParts.join(', ') : '') +
    (userForm.comm ? '\nПожелания: ' + userForm.comm : '');
}

function pushCartItem(prodId, vi, size, color) {
  var found = null;
  for (var i = 0; i < cart.length; i++) {
    if (cart[i].id === prodId && cart[i].vi === vi && cart[i].size === size && cart[i].color === color) {
      found = cart[i]; break;
    }
  }
  if (found) found.q++;
  else cart.push({ id: prodId, vi: vi, size: size, color: color, q: 1 });
}

document.addEventListener('click', function(e) {
  var t = e.target;
  while (t && t !== document && t.tagName !== 'BUTTON' && t.id !== 'ov') {
    t = t.parentNode;
  }
  if (!t || t === document) return;
  if (t.id === 'ov' && e.target === t) { $('ov').className = 'ov'; return; }

  var langAttr   = t.getAttribute('data-lang');
  var currAttr   = t.getAttribute('data-curr');
  var catAttr    = t.getAttribute('data-cat');
  var openAttr   = t.getAttribute('data-open');
  var closeAttr  = t.getAttribute('data-close');
  var colAttr    = t.getAttribute('data-color');
  var sizeAttr   = t.getAttribute('data-size');
  var addAttr    = t.getAttribute('data-add');
  var addAllAttr = t.getAttribute('data-add-all');
  var qAttr      = t.getAttribute('data-q');
  var sendAttr   = t.getAttribute('data-send');

  if (langAttr) {
    lang = langAttr;
    if (lang === 'en' && curr === 'RUB') curr = 'GBP';
    if (lang === 'ru' && curr !== 'RUB') curr = 'RUB';
    savePref();
    render();
  }
  else if (currAttr) {
    curr = currAttr;
    savePref();
    render();
  }
  else if (catAttr) { currentCat = catAttr; render(); }
  else if (openAttr) { openSheet(openAttr); }
  else if (closeAttr) { $('ov').className = 'ov'; }
  else if (colAttr) { sel.color = colAttr; drawSheet(); }
  else if (sizeAttr) { sel.size[t.getAttribute('data-vi')] = sizeAttr; drawSheet(); }
  else if (addAttr !== null) {
    var vi = parseInt(addAttr, 10);
    if (!sel.size[vi] && cur.vs[vi].s.length > 1) {
      toast(lang === 'en' ? 'Please select your preferred size' : 'Пожалуйста, укажите желаемый размер');
      return;
    }
    var size = sel.size[vi] || cur.vs[vi].s[0];
    pushCartItem(cur.id, vi, size, sel.color);
    saveCart();
    updateBar();
    $('ov').className = 'ov';
    toast(lang === 'en' ? 'Added to bag' : 'Добавлено в корзину');
  }
  else if (addAllAttr !== null) {
    for (var k = 0; k < cur.vs.length; k++) {
      if (!sel.size[k] && cur.vs[k].s.length > 1) {
        toast((lang === 'en' ? 'Select size for: ' : 'Выберите размер для: ') + trWord(cur.vs[k].n));
        return;
      }
    }
    for (var m = 0; m < cur.vs.length; m++) {
      var sz = sel.size[m] || cur.vs[m].s[0];
      pushCartItem(cur.id, m, sz, sel.color);
    }
    saveCart();
    updateBar();
    $('ov').className = 'ov';
    toast(lang === 'en' ? 'Full set added to bag' : 'Комплект добавлен в корзину');
  }
  else if (t.id === 'barBtn') { drawCart(); $('ov').className = 'ov on'; }
  else if (qAttr !== null) {
    saveUserForm();
    var idx = parseInt(qAttr, 10), d = parseInt(t.getAttribute('data-d'), 10);
    cart[idx].q += d;
    if (cart[idx].q < 1) cart.splice(idx, 1);
    saveCart();
    updateBar();
    drawCart();
  }
  else if (sendAttr) {
    var url = 'https://t.me/' + ORDER_TO + '?text=' + encodeURIComponent(orderText());
    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData && Telegram.WebApp.openTelegramLink) {
      Telegram.WebApp.openTelegramLink(url);
    } else {
      window.open(url, '_blank') || (location.href = url);
    }
  }
});

try {
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    if (Telegram.WebApp.disableVerticalSwipes) {
      Telegram.WebApp.disableVerticalSwipes();
    }
  }
} catch(_) {}

loadState();
render();
</script>
</body>
</html>
